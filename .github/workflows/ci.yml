name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── relctl: PR metadata + version preview ─────────────────────────────────
  build-info:
    # The reusable workflow posts relctl's help comment on the pull request and
    # requests pull-requests: write; the caller must grant at least that.
    permissions:
      contents: read
      pull-requests: write
    uses: layer87-labs/relctl-action/.github/workflows/generate-build-infos.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # ── Go: lint, test, build ─────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: make build

  # ── Python: whisper server tests (stubbed model, no download) ─────────────
  whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install fastapi httpx python-multipart pytest

      - name: Test
        run: pytest -q deploy/whisper

  # ── Python: parakeet server tests (fake model, real audio decoding) ───────
  parakeet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          grep -E '^(numpy|av|fastapi|python-multipart)==' deploy/parakeet/requirements.txt > /tmp/test-req.txt
          pip install -r /tmp/test-req.txt httpx pytest

      - name: Test
        run: pytest -q deploy/parakeet

  # ── Helm: render the chart with optional backends off and on ──────────────
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Test
        run: scripts/test-chart.sh
