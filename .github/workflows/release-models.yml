name: Release Models

# Trigger: manually via workflow_dispatch, or on changes to model Containerfiles.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which model images to build (comma-separated: embedding,reranker,whisper or 'all')"
        required: true
        default: "all"
        type: string
  push:
    branches: [main]
    paths:
      - "deploy/Containerfile.tei-model-init"
      - "deploy/Containerfile.tei-reranker-model-init"
      - "deploy/Containerfile.whisper"
      - "deploy/whisper/**"

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless OIDC signing

env:
  REGISTRY: ghcr.io/layer87-labs

jobs:
  embedding-model:
    if: >
      github.event_name == 'push' ||
      contains(github.event.inputs.targets, 'embedding') ||
      github.event.inputs.targets == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set model tag
        run: echo "MODEL_TAG=bge-m3-$(date +%Y.%m)" >> $GITHUB_ENV

      - name: Build and push TEI model init (embedding)
        run: |
          docker build \
            -f deploy/Containerfile.tei-model-init \
            --build-arg MODEL_ID=BAAI/bge-m3 \
            -t ${{ env.REGISTRY }}/tei-model-init:${{ env.MODEL_TAG }} \
            -t ${{ env.REGISTRY }}/tei-model-init:latest \
            .
          docker push ${{ env.REGISTRY }}/tei-model-init:${{ env.MODEL_TAG }}
          docker push ${{ env.REGISTRY }}/tei-model-init:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via OIDC, by digest)
        run: scripts/sign-image.sh "${{ env.REGISTRY }}/tei-model-init:${{ env.MODEL_TAG }}"

  reranker-model:
    if: >
      github.event_name == 'push' ||
      contains(github.event.inputs.targets, 'reranker') ||
      github.event.inputs.targets == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default: small multilingual cross-encoder that ships its own ONNX file.
          - slug: mmarco-mminilmv2-l12-h384-v1
            model_id: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
            revision: 1427fd652930e4ba29e8149678df786c240d8825
            push_latest: true
          # Higher quality, much slower on CPU; exported to ONNX at build time.
          - slug: bge-reranker-v2-m3
            model_id: BAAI/bge-reranker-v2-m3
            revision: ""
            push_latest: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set model tag
        run: echo "MODEL_TAG=${{ matrix.slug }}-$(date +%Y.%m)" >> $GITHUB_ENV

      - name: Build and push TEI reranker model init (ONNX)
        run: |
          docker build \
            -f deploy/Containerfile.tei-reranker-model-init \
            --build-arg MODEL_ID=${{ matrix.model_id }} \
            --build-arg MODEL_REVISION=${{ matrix.revision }} \
            --build-arg MODEL_DATE=$(date +%Y.%m) \
            -t ${{ env.REGISTRY }}/tei-reranker-model-init:${{ env.MODEL_TAG }} \
            .
          docker push ${{ env.REGISTRY }}/tei-reranker-model-init:${{ env.MODEL_TAG }}
          if [ "${{ matrix.push_latest }}" = "true" ]; then
            docker tag ${{ env.REGISTRY }}/tei-reranker-model-init:${{ env.MODEL_TAG }} ${{ env.REGISTRY }}/tei-reranker-model-init:latest
            docker push ${{ env.REGISTRY }}/tei-reranker-model-init:latest
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via OIDC, by digest)
        run: scripts/sign-image.sh "${{ env.REGISTRY }}/tei-reranker-model-init:${{ env.MODEL_TAG }}"

  whisper-model:
    if: >
      github.event_name == 'push' ||
      contains(github.event.inputs.targets, 'whisper') ||
      github.event.inputs.targets == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract whisper model from Containerfile
        run: |
          MODEL=$(grep '^ARG WHISPER_MODEL=' deploy/Containerfile.whisper | sed 's/ARG WHISPER_MODEL=//')
          echo "WHISPER_MODEL=${MODEL}" >> $GITHUB_ENV
          echo "MODEL_TAG=${MODEL}-$(date +%Y.%m)" >> $GITHUB_ENV

      - name: Build and push whisper
        run: |
          docker build \
            -f deploy/Containerfile.whisper \
            -t ${{ env.REGISTRY }}/whisper:${{ env.MODEL_TAG }} \
            -t ${{ env.REGISTRY }}/whisper:latest \
            .
          docker push ${{ env.REGISTRY }}/whisper:${{ env.MODEL_TAG }}
          docker push ${{ env.REGISTRY }}/whisper:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via OIDC, by digest)
        run: scripts/sign-image.sh "${{ env.REGISTRY }}/whisper:${{ env.MODEL_TAG }}"
