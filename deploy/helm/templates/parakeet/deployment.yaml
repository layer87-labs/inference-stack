{{- if .Values.parakeet.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-stack.fullname" . }}-parakeet
  labels:
    {{- include "inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: parakeet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inference-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: parakeet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "inference-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: parakeet
    spec:
      securityContext:
        {{- toYaml .Values.parakeet.podSecurityContext | nindent 8 }}
      {{- include "inference-stack.imagePullSecrets" (dict "local" .Values.parakeet.imagePullSecrets "global" .Values.global.imagePullSecrets) | nindent 6 }}
      {{- with (coalesce .Values.parakeet.nodeSelector .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.parakeet.tolerations .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.parakeet.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.parakeet.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: parakeet
        image: {{ include "inference-stack.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.parakeet.image.repository "tag" .Values.parakeet.image.tag "appVersion" .Chart.AppVersion) }}
        imagePullPolicy: {{ .Values.parakeet.image.pullPolicy }}
        env:
        - name: MODEL_NAME
          value: {{ .Values.parakeet.modelName | quote }}
        - name: PORT
          value: {{ .Values.parakeet.service.port | quote }}
        - name: CPU_THREADS
          value: {{ .Values.parakeet.cpuThreads | quote }}
        - name: PARAKEET_LANGUAGE
          value: {{ .Values.parakeet.language | quote }}
        - name: MAX_UPLOAD_MB
          value: {{ .Values.parakeet.maxUploadMB | quote }}
        - name: MAX_AUDIO_S
          value: {{ .Values.parakeet.maxAudioSeconds | quote }}
        - name: CHUNK_S
          value: {{ .Values.parakeet.chunkSeconds | quote }}
        - name: MAX_CONCURRENT
          value: {{ .Values.parakeet.maxConcurrent | quote }}
        - name: MAX_QUEUE
          value: {{ .Values.parakeet.maxQueue | quote }}
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        ports:
        - name: http
          containerPort: {{ .Values.parakeet.service.port }}
          protocol: TCP
        # /health never queues behind inference and reports ready only after
        # the model is loaded and the warmup has run.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        {{- if .Values.parakeet.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: {{ .Values.parakeet.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.parakeet.startupProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.parakeet.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.parakeet.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.parakeet.tmpSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-stack.fullname" . }}-parakeet
  labels:
    {{- include "inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: parakeet
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.parakeet.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "inference-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: parakeet
{{- if .Values.parakeet.networkPolicy.enabled }}
---
# Ingress only from the router pods of this release, on the service port.
# No egress: the model is in the image and the server calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inference-stack.fullname" . }}-parakeet
  labels:
    {{- include "inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: parakeet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inference-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: parakeet
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "inference-stack.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: router
    ports:
    - port: http
      protocol: TCP
  egress: []
{{- end }}
{{- end }}
