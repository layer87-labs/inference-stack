{{- if .Values.whisper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-stack.fullname" . }}-whisper
  labels:
    {{- include "inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inference-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "inference-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: whisper
    spec:
      securityContext:
        {{- toYaml .Values.whisper.podSecurityContext | nindent 8 }}
      {{- include "inference-stack.imagePullSecrets" (dict "local" .Values.whisper.imagePullSecrets "global" .Values.global.imagePullSecrets) | nindent 6 }}
      {{- with (coalesce .Values.whisper.nodeSelector .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.whisper.tolerations .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.whisper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.whisper.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: whisper
        image: {{ include "inference-stack.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.whisper.image.repository "tag" .Values.whisper.image.tag "appVersion" .Chart.AppVersion) }}
        imagePullPolicy: {{ .Values.whisper.image.pullPolicy }}
        env:
        - name: MODEL_NAME
          value: "whisper-{{ .Values.whisper.modelName }}"
        - name: PORT
          value: {{ .Values.whisper.service.port | quote }}
        - name: CPU_THREADS
          value: {{ .Values.whisper.cpuThreads | quote }}
        - name: MAX_UPLOAD_MB
          value: {{ .Values.whisper.maxUploadMB | quote }}
        - name: MAX_CONCURRENT
          value: {{ .Values.whisper.maxConcurrent | quote }}
        - name: WHISPER_LANGUAGE
          value: {{ .Values.whisper.language | quote }}
        - name: WHISPER_INITIAL_PROMPT
          value: {{ .Values.whisper.initialPrompt | quote }}
        - name: WHISPER_HOTWORDS
          value: {{ .Values.whisper.hotwords | quote }}
        - name: WHISPER_CONDITION_ON_PREVIOUS_TEXT
          value: {{ .Values.whisper.conditionOnPreviousText | quote }}
        - name: WHISPER_BATCH_THRESHOLD_S
          value: {{ .Values.whisper.batchThresholdSeconds | quote }}
        - name: WHISPER_BATCH_SIZE
          value: {{ .Values.whisper.batchSize | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.whisper.service.port }}
          protocol: TCP
        # /health is answered independently of inference (see
        # deploy/whisper/server.py), so a long transcription cannot fail it. It
        # reports ready only after the model is loaded and the warmup has run.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        {{- if .Values.whisper.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.whisper.startupProbe.httpGet.path }}
            port: {{ .Values.whisper.startupProbe.httpGet.port }}
          periodSeconds: {{ .Values.whisper.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.whisper.startupProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.whisper.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.whisper.securityContext | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-stack.fullname" . }}-whisper
  labels:
    {{- include "inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisper
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.whisper.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "inference-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: whisper
{{- end }}
