# Inference Stack — Helm values
#
# All model backends are disabled by default.
# Enable selectively per deployment:
#
#   embedding.enabled: true
#   reranker.enabled:  true
#   whisper.enabled:   true
#   router.enabled:    true
#
# Architecture:
#   tei-runtime             — TEI image for embedding (BGE-M3) and reranking (bge-reranker-v2-m3)
#   tei-model-init          — init container that copies baked embedding model to a shared volume
#   tei-reranker-model-init — init container that copies ONNX-exported reranker model to a shared volume
#   whisper                 — ASR server with model baked in
#   router                  — unified OpenAI-compatible proxy

# ── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: "ghcr.io/layer87-labs"
  storageClass: ""
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

# ── Inference Router ──────────────────────────────────────────────────────────
router:
  enabled: true

  image:
    repository: inference-router
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 8080

  metricsPort: 9090

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  healthCheckInterval: "15s"

  # Extra environment variables for the router, e.g. to tune per-backend
  # timeouts (WHISPER_TIMEOUT, ROUTER_WRITE_TIMEOUT, ...). List of EnvVar.
  extraEnv: []

  # Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Embedding — BAAI/bge-m3 ───────────────────────────────────────────────────
embedding:
  enabled: false

  # Number of TEI embedding replicas. TEI is CPU-bound and forces
  # max_batch_requests=8 per process regardless of tuning, so more capacity
  # comes from running more independent replicas (each with its own batch
  # queue) rather than from raising batch size within one pod. When > 1,
  # persistence.enabled is ignored (see persistence below) — the baked-in
  # model-init container re-copies the model on every start regardless, so
  # a per-replica PVC is not needed and a single shared ReadWriteOnce PVC
  # would not work across replicas anyway.
  replicaCount: 1

  # tei-runtime image — TEI embedding server (BGE-M3)
  image:
    repository: tei-runtime
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # Model init container — copies baked model to shared /model volume
  # Model images are versioned independently: <model>-<YYYY.MM>
  modelInit:
    image:
      repository: tei-model-init
      tag: "bge-m3-2026.06" # model images have their own version scheme
      pullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop: [ALL]

  # TEI args
  modelID: "/model" # model is loaded from volume, not HuggingFace
  dtype: "float32"
  # Pooling strategy for BGE-M3 embeddings
  pooling: "cls"
  # CPU tuning: default --max-batch-tokens is 16384 (GPU-tuned, OOMs on CPU).
  # Use 4096 for fp32 on CPU to keep RSS at ~3-6Gi.
  #
  # Resource requirements by --max-batch-tokens (BGE-M3, fp32, CPU):
  #   4096  -> 3-6Gi  RSS  (recommended for CPU)
  #   8192  -> 6-10Gi RSS  (may OOM on 8Gi limit)
  #   16384 -> 10-16Gi RSS (GPU-only, OOMs on typical CPU nodes)
  extraArgs:
    - "--max-batch-tokens"
    - "4096"

  service:
    port: 80

  resources:
    requests:
      cpu: "500m"
      memory: "3Gi"
    limits:
      cpu: "2"
      memory: "6Gi"

  # Model volume — PVC keeps model across pod restarts (avoids re-copy)
  # Set enabled: false to use emptyDir (model copied from init container every start)
  # Ignored (treated as false) when replicaCount > 1 — see replicaCount above.
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: "" # falls back to global.storageClass

  startupProbe:
    periodSeconds: 15
    failureThreshold: 40 # up to 10 min for model load

  # readinessProbe hits TEI's own /health, which shares TEI's internal
  # request queue with /v1/embeddings — under a large request burst, /health
  # itself can queue behind the backlog and time out. A higher
  # failureThreshold gives a legitimately-busy-but-alive pod enough runway
  # to drain its backlog before Kubernetes pulls it out of Service
  # Endpoints (which would make things worse, not better, since it reduces
  # available capacity right when it's needed most). livenessProbe uses the
  # same /health endpoint, so it queues behind the same backlog: with a
  # tight threshold a busy-but-alive pod gets SIGTERMed (clean exit 0, not
  # OOM), which destroys in-progress work and makes the backlog worse. The
  # liveness window is therefore long (~5 min); only a genuinely wedged
  # process should be restarted.
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 9 # ~90s tolerance for transient queue backlog
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10 # ~5 min of consecutive failures

  # Pod-level security context
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  # Optional scheduling rules; empty = scheduler default. Example: prefer
  # spreading replicas over nodes with a soft anti-affinity
  #   affinity:
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           topologyKey: kubernetes.io/hostname
  #           labelSelector:
  #             matchLabels:
  #               app.kubernetes.io/component: embedding
  affinity: {}
  # Example: spread replicas over nodes, but never block scheduling
  #   topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: kubernetes.io/hostname
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: embedding
  topologySpreadConstraints: []

# ── Reranker — BAAI/bge-reranker-v2-m3 ───────────────────────────────────────
# Uses TEI (Rust/ONNX via ORT backend) — same runtime image as embedding.
# Model is exported to ONNX during image build (tei-reranker-model-init).
# TEI auto-detects SequenceClassification architecture → reranker mode.
# Router rewrites /v1/rerank → /rerank before forwarding to this backend.
reranker:
  enabled: false

  # See embedding.replicaCount above for the same reasoning (CPU-bound TEI,
  # persistence.enabled is ignored when > 1).
  replicaCount: 1

  # tei-runtime image — same runtime as embedding, handles reranking via ONNX
  image:
    repository: tei-runtime
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # Model init container — ONNX-exported bge-reranker-v2-m3
  modelInit:
    image:
      repository: tei-reranker-model-init
      tag: "bge-reranker-v2-m3-2026.06"
      pullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop: [ALL]

  modelID: "/model"

  # CPU tuning: ORT warmup with default 16384 batch tokens OOMs on CPU nodes.
  # 2048 keeps RSS within 8Gi limit during warmup and inference.
  #
  # Resource requirements by --max-batch-tokens (bge-reranker-v2-m3, fp32 ONNX, CPU):
  #   2048  -> 4-8Gi  RSS  (recommended for CPU)
  #   4096  -> 8-12Gi RSS  (may OOM on 8Gi limit)
  #   16384 -> OOM         (GPU-only)
  extraArgs:
    - "--max-batch-tokens"
    - "2048"

  service:
    port: 80

  resources:
    requests:
      cpu: "500m"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Model volume — PVC keeps model across pod restarts (avoids re-copy)
  # Ignored (treated as false) when replicaCount > 1 — see replicaCount above.
  persistence:
    enabled: true
    size: "4Gi"
    storageClass: "" # falls back to global.storageClass

  startupProbe:
    periodSeconds: 15
    failureThreshold: 40 # up to 10 min for ONNX model load + ORT warmup

  # See embedding.readinessProbe/livenessProbe above for the reasoning.
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 9
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  # Pod-level security context
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

# ── Whisper — OpenAI-compatible ASR ───────────────────────────────────────────
# faster-whisper (CTranslate2, int8) behind deploy/whisper/server.py.
# POST /v1/audio/transcriptions and /v1/audio/translations; /health is
# answered independently of inference. The model is baked into the image, so
# no PVC or init container is needed.
whisper:
  enabled: false

  # Image has the model baked in — versioned as <model>-<YYYY.MM>
  image:
    repository: whisper
    tag: "large-v3-turbo-2026.10"
    pullPolicy: IfNotPresent

  modelName: "large-v3-turbo"

  # Default transcription language (ISO-639-1, e.g. "de"). Empty = auto-detect
  # per request. A request's own `language` field always wins.
  language: ""

  # Server-side default prompt (WHISPER_INITIAL_PROMPT), empty = off. Use it for
  # vocabulary and spelling that clients cannot send themselves (e.g. an STT
  # integration that only sends model + language). A request's `prompt` is
  # appended after it. Whisper uses at most ~223 tokens; longer text is cut
  # from the front. Example: "Release notes for Kubernetes, PostgreSQL and
  # Grafana."
  initialPrompt: ""

  # Server-side default hotwords (WHISPER_HOTWORDS), empty = off. A request's
  # `hotwords` field replaces it. Free text, e.g. "Kubernetes Grafana Postgres".
  hotwords: ""

  # CTranslate2 threads. Must match the CPU limit: CTranslate2 sizes itself by
  # the node's cores, not by the cgroup limit.
  cpuThreads: 4

  # Upload size limit per request (MB). Must stay below any body-size limit of
  # the ingress/gateway in front of the router.
  maxUploadMB: 100

  # Transcriptions run one at a time (CPU-bound); further requests queue in
  # the server. Keep the router's WHISPER_TIMEOUT above queue time + runtime.
  maxConcurrent: 1

  service:
    port: 9000

  # Measured with large-v3-turbo / int8: ~2.0 GiB RSS peak; ~1x real-time on
  # 2 threads (a 3.7 min recording took 3.3 min), faster with more threads.
  resources:
    requests:
      cpu: "2000m"
      memory: "3Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  # Startup probe — model load takes ~10-30s from local disk.
  startupProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 30

  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  # Optional scheduling rules; empty = scheduler default. Example: prefer
  # spreading replicas over nodes with a soft anti-affinity
  #   affinity:
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           topologyKey: kubernetes.io/hostname
  #           labelSelector:
  #             matchLabels:
  #               app.kubernetes.io/component: whisper
  affinity: {}
  # Example: spread replicas over nodes, but never block scheduling
  #   topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: kubernetes.io/hostname
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: whisper
  topologySpreadConstraints: []

# ── ServiceMonitor (Prometheus Operator) ──────────────────────────────────────
serviceMonitor:
  enabled: false
  namespace: ""
  labels:
    release: kube-prometheus-stack
  interval: "30s"
  scrapeTimeout: "10s"

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  ingressNamespaces: []
